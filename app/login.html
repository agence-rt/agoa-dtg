<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Connexion — AGOA DTG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;font-family:"Segoe UI","Open Sans",system-ui,sans-serif;color:#555}
body{display:flex;flex-direction:column;align-items:center;border:1px solid #d9d9d9;padding:0 36px}
.logo{width:72px;height:72px;margin-top:30px;border-radius:17px}
h1{margin:22px 0 0;font-size:22px;letter-spacing:.28em;font-weight:700;color:#1d1d1d;padding-left:.28em}h1 b{color:#b3261e}
p{margin:14px 0 0;font-size:13.5px;text-align:center;line-height:1.45;color:#666}
button{font:inherit;cursor:pointer}
#go{margin-top:20px;display:flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid #dadce0;border-radius:6px;background:#fff;font-size:14px;font-weight:600;color:#3c4043}
#go:hover{background:#f7f8f8}#go[disabled]{opacity:.55;cursor:default}
#go svg{width:18px;height:18px}
#msg{min-height:38px;margin-top:12px;font-size:12.5px;text-align:center;color:#b3261e}
#msg.inf{color:#666}
.lnk{background:none;border:0;color:#666;text-decoration:underline;font-size:12px;margin-top:2px}
.ver{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#999}
</style></head><body>
<img class="logo" src="build/logo.png" alt="">
<h1>AGOA <b>DTG</b></h1>
<p id="intro">Connectez-vous avec le compte Google de l'agence.</p>
<button id="go"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span id="gl">Se connecter avec Google</span></button>
<div id="msg" class="inf"></div>
<button class="lnk" id="set" hidden>Ouvrir les paramètres</button>
<button class="lnk" id="skip" hidden>Continuer sans connexion</button>
<div class="ver" id="ver"></div>
<script>
const { ipcRenderer } = require("electron"), $ = s => document.getElementById(s);
(async () => {
  const st = await ipcRenderer.invoke("google:state");
  $("ver").textContent = "v" + st.version;
  if (!st.configured) { $("msg").className = ""; $("msg").textContent = "La connexion Google n'est pas encore configurée sur ce poste (identifiant ou code secret du client OAuth manquant)."; $("go").disabled = true; $("set").hidden = false; $("skip").hidden = false; }
})();
$("go").onclick = async () => {
  $("go").disabled = true; $("msg").className = "inf"; $("msg").textContent = "Terminez la connexion dans votre navigateur…";
  const r = await ipcRenderer.invoke("google:login");
  if (r.ok) { $("msg").textContent = "Connecté : " + r.email; return; }
  $("go").disabled = false; $("msg").className = ""; $("msg").textContent = r.message || "Connexion impossible.";
};
$("set").onclick = () => ipcRenderer.invoke("google:settings");
$("skip").onclick = () => ipcRenderer.invoke("google:skip");
</script></body></html>
