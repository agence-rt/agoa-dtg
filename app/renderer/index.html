    const placeSplit = (makeBox, items) => {
      let bx = makeBox(false); cur.body.append(bx.root);
      if (!fits() && cur.body.children.length > 1) { bx.root.remove(); newPage(cur.r1, cur.r2); cur.body.append(bx.root); }
      let n = 0;
      for (const it of items) {
        bx.target.insertAdjacentHTML("beforeend", it);
        if (!fits()) {
          bx.target.lastElementChild.remove();
          if (n === 0 && cur.body.children.length > 1) { bx.root.remove(); newPage(cur.r1, cur.r2); cur.body.append(bx.root); }
          else { newPage(cur.r1, cur.r2); bx = makeBox(true); cur.body.append(bx.root); }
          bx.target.insertAdjacentHTML("beforeend", it);
        }
        n++;
      }
    };
    const fmtE = n => Math.round(n || 0).toLocaleString("fr-FR") + " €";
    const TCOL = { "Court terme (1-3 ans)": "#D0201A", "Moyen terme (3-6 ans)": "#1F6FC5", "Long terme (6-10 ans)": "#2C7A4B" };
    const tableSplit = (head, rows, caption) => placeSplit(cont => { const t = el(`<table class="ptbl">${caption && cont ? `<caption>${esc(caption)} (suite)</caption>` : ""}<thead><tr>${head}</tr></thead><tbody></tbody></table>`); return { root: t, target: $("tbody", t) }; }, rows);

    // ---- couverture
    if (!only) {
    const firstCover = data.photoUrl || data.buildings.flatMap(b => b.chapters).find(c => c.coverUrl && /FACADE/.test(c.type || ""))?.coverUrl || data.buildings.flatMap(b => b.chapters).find(c => c.coverUrl)?.coverUrl || null;
    const cpg = document.createElement("div"); cpg.className = "pdfpage cover"; host.append(cpg); pages.push(cpg);
    cpg.innerHTML = `<img class="cbg" src="${await coverCanvasUrl(firstCover)}" width="794" height="1123" alt=""><div class="ctxt"><div class="big">DTG<br>&amp;<br>PPPT</div><div class="sub">DIAGNOSTIC TECHNIQUE GLOBAL &amp; PROJET DE PLAN PLURIANNUEL DE TRAVAUX</div><div class="ver"><b>Version : ${esc(data.version || "1")}</b><br><b>Date :</b> ${esc(data.date || "")}</div><div class="adr">${esc(data.adresse || data.ref)}</div><div class="ag"><b>REMI THOLLET ARCHITECTE</b><br>47 avenue Mathurin Moreau 75019 PARIS</div></div>`;
    }

    // ---- obligations
    if (!only && data.oblig && data.oblig.length) {
      newPage("ANALYSE DE LA GESTION TECHNIQUE", "OBLIGATIONS LÉGALES");
      place(el(`<h1 class="pbt">SITUATION AU REGARD DES OBLIGATIONS LÉGALES</h1>`));
      const SC = { "Fait": "#2C7A4B", "À faire": "#D0201A", "En cours": "#C27C0E" };
      tableSplit(`<th style="width:34%">Obligation</th><th style="width:18%">Référence</th><th style="width:11%">Statut</th><th style="width:11%">Date</th><th>Conclusion</th>`, data.oblig.map(o => `<tr><td><b>${esc(o.l)}</b></td><td>${esc(o.ref)}</td><td style="font-weight:700;color:${SC[o.s] || "#333"}">${esc(o.s)}</td><td>${esc(o.d)}</td><td>${esc(o.c)}</td></tr>`), "Obligations légales");
    }
    // ---- bâtiments
    for (const b of data.buildings) {
      if (!only) {
      newPage(b.name, "FICHE BÂTIMENT");
      place(el(`<h1 class="pbt">${esc(b.name)}</h1>`));
      const kv = (b.info || []).filter(x => x[1]);
      if (kv.length) place(el(`<div class="pfld"><table class="pkv">${kv.map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(v).replace(/\n/g, "<br>")}</td></tr>`).join("")}</table></div>`));
      if (b.images.length) place(el(`<div class="pimgs">${b.images.map(im => `<figure><img src="${im.url}" width="${Math.round(im.w * 1.05)}" height="${Math.round(im.h * 1.05)}" alt=""><figcaption>${esc(im.label)}</figcaption></figure>`).join("")}</div>`));
      if (b.betLine) place(el(`<div class="pfld th"><div class="lb">Étude thermique (BET)</div><p>${esc(b.betLine)}</p></div>`));
      if (b.dpe) place(el(`<div class="pdpe"><div class="lb">Étiquette énergétique : classe ${esc(b.dpe.cls)}</div><img src="${b.dpe.url}" width="160" height="93" alt=""></div>`));
      }
      for (const c of b.chapters) {
        newPage(b.name, c.title);
        const cot = c.cot.length ? `<div class="pcot">${c.cot.map(x => `<div><span>${esc(x.label)}</span><br>${[1, 2, 3].map(n => `<img src="${n <= x.v ? icons[x.k].on : icons[x.k].off}" width="17" height="17" alt="">`).join("")}</div>`).join("")}</div>` : "";
        place(el(`<div class="chead">${c.coverUrl ? `<img class="ccov" src="${c.coverUrl}" width="118" height="118" alt="">` : ""}<div><h2 class="pct">${esc(c.title)}</h2>${c.etat ? `<div style="font-size:13px;margin:-2px 0 8px">État d’entretien général : <b style="color:${c.etatCol}">${esc(c.etat)}</b></div>` : ""}${cot}</div></div>`));
        for (const f of c.fields) {
          const cls = f.kind === "etat" ? "etat" : f.kind === "th" ? "th" : "";
          const paras = f.paras.map(runs => `<p>${runs.map(r => runHtml(r, f.noinfo ? "#7F7F7F" : null)).join("") || "&nbsp;"}</p>`);
          placeSplit(cont => { const d = el(`<div class="pfld ${cls}"><div class="lb">${esc(f.label)}${cont ? " (suite)" : ""}</div></div>`); return { root: d, target: d }; }, paras);
        }
        if (c.costs && c.costs.length) {
          place(el(`<div class="psec">TABLEAU DES COÛTS</div>`));
          const rows = []; let prev = null;
          c.costs.forEach(l => { if (prev !== null && prev !== l.terme) rows.push(`<tr class="gap"><td colspan="7"></td></tr>`); prev = l.terme;
            rows.push(`<tr><td style="color:${TCOL[l.terme] || "#333"};font-weight:${l.terme ? 700 : 400}">${esc(l.terme)}</td><td>${esc(l.des)}</td><td class="n">${esc(l.qte)}</td><td class="n">${esc(String(l.pu))}</td><td class="n">${fmtE(l.tot)}</td><td class="gain">${esc(l.gain)}</td><td class="sc">${esc(l.scen)}</td></tr>`); });
          const terms = [...new Set(c.costs.map(l => l.terme).filter(Boolean))];
          if (terms.length > 1 || (terms.length === 1 && c.costs.some(l => !l.terme))) terms.forEach(t => rows.push(`<tr class="sub"><td colspan="4" style="color:${TCOL[t]}">Sous-total ${esc(t.replace(/ \(.*\)/, "").toLowerCase())}</td><td class="n">${fmtE(c.costs.filter(l => l.terme === t).reduce((s, l) => s + l.tot, 0))}</td><td colspan="2"></td></tr>`));
          rows.push(`<tr class="tot"><td colspan="4">Total ${esc(c.title)}</td><td class="n">${fmtE(c.costs.reduce((s, l) => s + l.tot, 0))}</td><td colspan="2"></td></tr>`);
          tableSplit(`<th style="width:15%">Échéance</th><th>Désignation des travaux</th><th class="n" style="width:10%">Quantité</th><th class="n" style="width:10%">PU TTC</th><th class="n" style="width:12%">Coût TTC</th><th class="th" style="width:8%">Gain</th><th class="th" style="width:11%">Scénario</th>`, rows, "Tableau des coûts");
          place(el(`<div class="pnote">Estimatifs TTC sur la base des éléments visités, hors présence d’amiante ou de plomb, hors honoraires.</div>`));
        }
        if (c.photos.length) {
          let n0 = 0;
          placeSplit(() => { const d = el(`<div class="pphotos"></div>`); return { root: d, target: d }; }, c.photos.map(ph => `<figure class="pphoto"><img src="${ph.url}" width="${ph.w}" height="${ph.h}" alt=""><figcaption>Photo ${++n0}${ph.legend ? " – " + esc(ph.legend) : ""}</figcaption></figure>`));
        }
      }
    }
    // ---- PPPT
    if (data.pppt) {
      const P = data.pppt; const colL = { court: "Court terme", moyen: "Moyen terme", long: "Long terme", "": "Non planifié" }; const TC = { court: "#D0201A", moyen: "#1F6FC5", long: "#2C7A4B", "": "#444" };
      newPage("PROJET DE PLAN PLURIANNUEL DE TRAVAUX", "SYNTHÈSE");
      place(el(`<h1 class="pbt">PROJET DE PLAN PLURIANNUEL DE TRAVAUX</h1>`));
      place(el(`<div class="pnote" style="margin-bottom:12px">Estimatifs TTC sur la base des éléments visités, hors présence d’amiante ou de plomb, hors honoraires, CSPS, assurance dommages-ouvrage et frais annexes.</div>`));
      place(el(`<div class="psec">SYNTHÈSE PAR BÂTIMENT</div>`));
      tableSplit(`<th>Bâtiment</th>${P.cols.map(t => `<th class="n" style="color:${TC[t]}">${colL[t]}</th>`).join("")}<th class="n">Total TTC</th>`,
        P.matrix.map(m => `<tr><td><b>${esc(m.bname)}</b>${m.dpe ? ` (DPE ${m.dpe})` : ""}</td>${P.cols.map(t => `<td class="n" style="color:${TC[t]}">${m.v[t] ? fmtE(m.v[t]) : "—"}</td>`).join("")}<td class="n"><b>${fmtE(m.tot)}</b></td></tr>`)
          .concat([`<tr class="tot"><td>TOTAL</td>${P.cols.map(t => `<td class="n" style="color:${TC[t]}">${fmtE(P.matrix.reduce((s, m) => s + m.v[t], 0))}</td>`).join("")}<td class="n">${fmtE(P.grand)}</td></tr>`]));
      for (const t of P.terms) {
        place(el(`<div class="psec" style="color:${TC[t.key]};margin-top:18px">${esc(t.title)}</div>`));
        if (!t.groups.length) { place(el(`<div class="pnote">Aucun travaux.</div>`)); continue; }
        let n = 0; const rows = [];
        t.groups.forEach(g => { rows.push(`<tr class="grp"><td colspan="6">${esc(g.bname)}</td></tr>`); g.lines.forEach(l => rows.push(`<tr><td>${++n}</td><td>${esc(l.loc)}</td><td>${esc(l.des)}</td><td class="gain">${esc(l.gain)}</td><td class="sc">${esc(l.scen)}</td><td class="n">${fmtE(l.tot)}</td></tr>`)); rows.push(`<tr class="sub"><td colspan="5">Sous-total ${esc(g.bname)}</td><td class="n">${fmtE(g.sub)}</td></tr>`); });
        rows.push(`<tr class="tot"><td colspan="5" style="color:${TC[t.key]}">TOTAL ${esc(t.title)}</td><td class="n">${fmtE(t.total)}</td></tr>`);
        tableSplit(`<th style="width:6%">N°</th><th style="width:20%">Localisation</th><th>Désignation des travaux</th><th class="th" style="width:8%">Gain</th><th class="th" style="width:11%">Scénario</th><th class="n" style="width:14%">Estimatif TTC</th>`, rows, t.title);
      }
      newPage("PROJET DE PLAN PLURIANNUEL DE TRAVAUX", "SCÉNARIOS D’AMÉLIORATION");
      place(el(`<h1 class="pbt" style="color:#7030A0">SCÉNARIOS D’AMÉLIORATION THERMIQUE</h1>`));
      if (P.dpeGlobal) place(el(`<div style="margin:0 0 12px;font-weight:700">Performance actuelle de la copropriété : <span style="color:#7030A0">classe ${esc(P.dpeGlobal)}</span></div>`));
      tableSplit(`<th style="width:13%">Scénario</th><th>Travaux préconisés (BET)</th><th class="n" style="width:9%">Nb lignes</th><th class="n" style="width:14%">Estimatif TTC</th><th style="width:10%">Classe visée</th><th style="width:16%">Gain énergétique</th>`,
        P.scen.map(s => `<tr><td class="sc"><b>${s.name}</b></td><td>${esc(s.travaux || "—")}</td><td class="n">${s.lines.length}</td><td class="n"><b>${fmtE(s.total)}</b></td><td><b>${esc(s.classe || "—")}</b></td><td class="sc">${esc(s.gainPct || "En attente de l’étude thermique")}</td></tr>`));
      for (const s of P.scen.filter(s => s.lines.length)) {
        place(el(`<div class="psec" style="color:#7030A0;margin-top:18px">${esc(s.name.toUpperCase())}${s.classe ? " — classe visée " + esc(s.classe) : ""}${s.gainPct ? " — gain " + esc(s.gainPct) : ""}</div>`));
        tableSplit(`<th style="width:24%">Localisation</th><th>Désignation des travaux</th><th style="width:17%">Échéance</th><th class="th" style="width:8%">Gain</th><th class="n" style="width:14%">Estimatif TTC</th>`,
          s.lines.map(l => `<tr><td>${esc(l.loc)}</td><td>${esc(l.des)}</td><td style="color:${TC[l.tkey] || "#333"}">${esc(l.terme)}</td><td class="gain">${esc(l.gain)}</td><td class="n">${fmtE(l.tot)}</td></tr>`).concat([`<tr class="tot"><td colspan="4">Total ${s.name}</td><td class="n">${fmtE(s.total)}</td></tr>`]), s.name);
      }
    }
    // ---- numérotation et rendu
    const N = pages.length; pages.forEach((pg, i) => { const f = $(".pf", pg); if (f) f.textContent = "Page " + (i + 1) + " | " + N; });
    await Promise.all([...host.querySelectorAll("img")].map(i => i.decode ? i.decode().catch(() => {}) : null));
    if (only) { showPdfPreview(pages, host, only); return; }
    if (DESKTOP && window.dtgDesktop.pdfFromHtml) {   // PDF vectoriel : texte net et sélectionnable
      try {
        btn.innerHTML = '<span class="spin"></span> PDF vectoriel…';
        const css = pdfCss(); const body = pages.map(p => p.outerHTML).join("");
        const html = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>@page{size:210mm 297mm;margin:0} html,body{margin:0;padding:0;background:#fff} ${css} .pdfpage{ width:210mm !important; height:297mm !important; break-after:page; page-break-after:always; overflow:hidden; } .pdfpage:last-child{ break-after:auto; page-break-after:auto; }</style></head><body>${body}</body></html>`;
        const u8 = await window.dtgDesktop.pdfFromHtml(html);
        await saveBlob(new Blob([u8], { type: "application/pdf" }), S.d.ref + "-DTG base V" + (S.d.meta.version || "1") + ".pdf", "PDF", missing);
        host.remove(); btn.disabled = !S.d; btn.textContent = "Exporter PDF"; return;
      } catch (e) { console.warn("PDF vectoriel indisponible, export en image", e); }
    }
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    for (let i = 0; i < N; i++) {
      btn.innerHTML = `<span class="spin"></span> PDF ${i + 1}/${N}`;
      const canvas = await window.html2canvas(pages[i], { scale: 3.5, backgroundColor: "#ffffff", logging: false, useCORS: false, width: 794, height: 1123, windowWidth: 1200 });
      if (i) pdf.addPage("a4", "portrait");
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 210, 297, undefined, "SLOW");
    }
    await saveBlob(pdf.output("blob"), S.d.ref + "-DTG base V" + (S.d.meta.version || "1") + ".pdf", "PDF", missing);
  } catch (e) { console.error(e); toast("Erreur pendant l’export PDF : " + (e?.message || e)); if (only) host.remove(); }
  if (!only) { host.remove(); btn.disabled = !S.d; btn.textContent = "Exporter PDF"; }
}

/* ============ prévisualisation d'un chapitre (mêmes pages que le PDF) ============ */
function showPdfPreview(pages, host, cid) {
  const c = S.chaps[cid];
  const m = document.createElement("div"); m.className = "modal pvmodal";
  m.innerHTML = `<div class="dlg pvdlg" role="dialog" aria-modal="true"><div class="row" style="margin-bottom:10px"><h3 style="margin:0;flex:1">Prévisualisation — ${esc(c?.title || "")} <small class="muted">(${pages.length} page${pages.length > 1 ? "s" : ""}, rendu identique au PDF)</small></h3><button class="btn small" id="pvZ-">−</button><span class="muted" id="pvZv" style="min-width:42px;text-align:center"></span><button class="btn small" id="pvZ+">+</button><button class="btn primary" id="pvClose">Fermer</button></div><div class="pvscroll" id="pvScroll"></div></div>`;
  document.body.append(m);
  let z = 0.8; const box = m.querySelector("#pvScroll");
  const apply = () => { m.querySelector("#pvZv").textContent = Math.round(z * 100) + " %"; box.querySelectorAll(".pvwrap").forEach(w => { w.style.width = Math.round(794 * z) + "px"; w.style.height = Math.round(1123 * z) + "px"; w.firstElementChild.style.transform = "scale(" + z + ")"; }); };
  pages.forEach(pg => { const w = document.createElement("div"); w.className = "pvwrap"; pg.style.transformOrigin = "0 0"; pg.style.boxShadow = "0 1px 8px rgba(0,0,0,.35)"; w.append(pg); box.append(w); });
  apply();
  const close = () => { m.remove(); host.remove(); };
  m.querySelector("#pvClose").onclick = close; m.addEventListener("click", e => { if (e.target === m) close(); });
  m.querySelector("#pvZ-").onclick = () => { z = Math.max(0.4, z - 0.1); apply(); }; m.querySelector("#pvZ\\+").onclick = () => { z = Math.min(1.6, z + 0.1); apply(); };
  m.addEventListener("keydown", e => { if (e.key === "Escape") close(); }); m.tabIndex = -1; m.focus();
}
async function previewChapter(cid) {
  if (!S.d || !S.chaps[cid]) return;
  const btn = $('[data-cact="preview"]'); const old = btn?.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Aperçu…'; }
  try { await flushSave(); await exportPDF(cid); } catch (e) { toast("Prévisualisation impossible : " + (e?.message || e)); }
  if (btn) { btn.disabled = false; btn.innerHTML = old; }
}

/* ============ tabs & boot ============ */
function setTab(t) {
  S.tab = t;
  $$(".tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["sources", "redac", "pppt", "photos"].forEach(x => $("#v-" + x).classList.toggle("hidden", x !== t));
  if (t === "sources") renderSources(); if (t === "redac") { renderTree(); renderEditor(); } else renderDrawer(); if (t === "photos") renderPhotos(); if (t === "pppt") renderPPPT();
}
$$(".tabs [data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#btnPdf").onclick = exportPDF;
$("#btnSaveDtg").onclick = () => saveDtgFile();
async function closeDossier() {
  if (pending.c.size || pending.d) { clearTimeout(pending.t); await flushSave(); }
  S.d = null; S.slug = null; S.chaps = {}; S.sel = null; S.transcripts = {}; S.docs = {}; S.photos = new Map(); S.selPhotos.clear(); S.imgs = {}; S.lastSaved = null; S.log = []; S.drawer = false;
  recentCache = null; setTab("sources"); renderAll(); showLastSaved();
}
$("#btnClose").onclick = closeDossier;
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("[data-save-dtg]")) saveDtgFile(); });
$("#dtgpick").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if (f) importDtg(await f.arrayBuffer(), f.name); });
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("[data-close-dossier]")) closeDossier(); });
$("#btnPending").onclick = () => openIdentify(pendingTx(), 0);
function renderAll() {
  const rc = $("#refchip"); if (S.d) { rc.textContent = S.d.ref; rc.classList.remove("hidden"); } else rc.classList.add("hidden");
  $("#btnPdf").disabled = !S.d; $("#btnClose").classList.toggle("hidden", !S.d); $("#btnSaveDtg").disabled = !S.d;
  const pn = S.d ? pendingTx().length : 0; const bp = $("#btnPending");
  bp.classList.toggle("hidden", !pn); bp.textContent = pn + " vidéo(s) à identifier";
  if (S.tab === "sources") renderSources(); else if (S.tab === "redac") { renderTree(); renderEditor(); } else if (S.tab === "pppt") renderPPPT(); else renderPhotos();
}
(function showVersion() { const el = document.getElementById("appVer"); if (!el) return; const v = DESKTOP && window.dtgDesktop.version ? window.dtgDesktop.version : APP_VERSION; el.textContent = "v" + v + (DESKTOP ? " · version de test" : " · en ligne"); if (DESKTOP) document.title = "Atelier DTG " + v + " (test)"; })();
(async function boot() {
  renderSources();
  await Store.init();
  recentCache = null; renderSources();
  if (!(window.claude && window.claude.use)) logLine("Cette page doit être ouverte depuis claude.ai pour accéder à Dropbox et à l’assistant IA.", "er");
})();
window.addEventListener("beforeunload", () => { if (pending.c.size || pending.d) flushSave(); });
</script>
