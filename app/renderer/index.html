<style>

  }
}
:root[data-theme="dark"]{
    --bg:#12171C; --panel:#1A2027; --sheet:#1D242B; --ink:#E5E9ED; --muted:#98A3AE; --line:#2C353E; --soft:#222A32;
    --accent:#7DB0DE; --accent-ink:#0E1620; --accent-soft:#1F3347;

:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

/* top bar */

const VENT = {
  "Caractéristiques constructives": "Historiquement, les immeubles de type haussmannien reposaient sur un principe de ventilation naturelle par balayage. Le renouvellement de l'air était assuré de manière passive : l'air neuf pénétrait par les menuiseries extérieures bois, structurellement \"permissives\" (faible étanchéité à l'air), et l'air vicié était évacué via des conduits de ventilation naturelle ou des conduits de fumée situés dans les pièces de service (cuisines, salles d'eau, WC).\nCependant, les campagnes successives de rénovation thermique ont rompu cet équilibre. Le remplacement des fenêtres d'origine par des menuiseries modernes (PVC, aluminium ou bois à joint d'étanchéité) a rendu les logements de plus en plus étanches. Parallèlement, les entrées d'air ont souvent été obstruées par les occupants ou mal positionnées lors des travaux, empêchant tout renouvellement d'air efficace.\nCette absence de ventilation conduit aujourd'hui à un confinement des logements. Un occupant produit en moyenne 2 à 3 litres de vapeur d'eau par jour (respiration, hygiène, cuisine). Sans extraction suffisante, cette vapeur d'eau sature l'air ambiant et condense au contact des parois froides (ponts thermiques en tête de dalle, entourages de fenêtres, fonds de placards). Ce phénomène entraîne inévitablement l'apparition de moisissures, des dégradations des revêtements et pose des risques sanitaires pour les occupants.",

isation de l'Assemblée Générale (AG) : le copropriétaire doit obtenir un vote favorable en AG avant tout percement.\nResponsabilité : en cas de désordre futur (infiltration d'eau par le percement, salissures sur la pierre dues aux graisses de cuisine), la responsabilité du copropriétaire peut être engagée."

function mcpMessage(e) {
  const c = e?.code;
  if (c === "needs_reauth") return "La connexion Dropbox a expiré. Reconnectez Dropbox dans claude.ai › Paramètres › Connecteurs.";
  if (c === "server_not_connected") return "Dropbox n’est pas connecté à votre compte. Ajoutez-le dans claude.ai › Paramètres › Connecteurs.";
  if (c === "selection_required") return "Plusieurs connecteurs Dropbox existent : choisissez-en un dans la fenêtre proposée par Claude.";
  if (c === "not_in_manifest" || c === "consent_required") return "L’accès à Dropbox a été refusé pour cette page. Rechargez la page pour l’autoriser.";
  if (c === "blocked_by_policy" || c === "approval_required") return "Votre organisation bloque cet accès Dropbox.";
  if (c === "server_unavailable") return "Dropbox ne répond pas pour le moment. Réessayez dans quelques instants.";
  if (c === "no_mcp" || c === "not_granted" || c === "capability_disabled") return "L’accès aux connecteurs n’est pas disponible dans cette vue. Ouvrez l’atelier depuis claude.ai.";

  let r;

  catch (e) {
    if (e && e.retryable) { await sleep((e.retryAfterMs || 1500) + Math.random() * 500); r = await mcp.callTool("Dropbox", tool, input); }

  }

}

  if (kinds) input.object_types = kinds;

const pick = (list, re) => list.find(e => (e.object_type === "folder" || e.object_type === "mount") && re.test(e.name));

async function locateDossier(ref) {
  const { code, ind } = parseRef(ref);
  logLine("Recherche de « " + code + " » dans Dropbox…", "run");
  const res = await dbx("search", { query: code, include_folders: true, filename_only: true, max_results: 100 });
  // Le dossier d'opération est toujours 01-OPERATIONS/(lettre)/CODE : on le déduit du chemin des résultats
  // (un dossier homonyme peut exister plus bas dans l'arborescence, ex. pièces de PC).
  let root = null;
  for (const r of (res?.results || [])) {
    const m = (r.path_display || "").match(/^(.*\/01-OPERATIONS\/\(([^)\/]+)\)\/([^\/]+))/i);
    if (!m || m[3].toUpperCase() !== code) continue;
    const seg = "(" + m[2] + ")/" + m[3];
    const i = (r.path || "").toLowerCase().indexOf(seg.toLowerCase());
    const path = i >= 0 ? r.path.slice(0, i + seg.length) : m[1];
    root = { path, path_display: m[1], name: m[3] }; break;
  }
  if (!root) throw { code: "nf", message: "Aucun dossier « " + code + " » trouvé dans 01-OPERATIONS." };
  logLine("Dossier trouvé : " + root.path_display, "ok");
  const kids = (await listAll(root.path, false, ["folder"])).filter(k => /^[A-Z0-9]{1,2}\s*-/i.test(k.name));
  const dtgs = kids.filter(k => /DTG/i.test(k.name));
  const byInd = ind ? kids.find(k => new RegExp("^" + ind + "\\s*-", "i").test(k.name)) : null;
  let opFolder = null;
  if (dtgs.length === 1) opFolder = dtgs[0];
  else if (dtgs.length > 1) opFolder = (byInd && dtgs.includes(byInd)) ? byInd : null;
  if (!opFolder && dtgs.length > 1) {
    const v = await ask("Plusieurs indices DTG existent dans " + code + ". Lequel ouvrir ?", dtgs.map(k => [k.name, k.path]).concat([["Annuler", ""]]));
    opFolder = dtgs.find(k => k.path === v);
    if (!opFolder) throw { code: "nf", message: "Ouverture annulée." };
  }
  if (!opFolder) throw { code: "nf", message: "Aucun indice contenant « DTG » dans " + root.path_display + " (indices présents : " + (kids.map(k => k.name).join(", ") || "aucun") + ")." };
  if (ind && byInd && byInd !== opFolder) logLine("L’indice " + ind + " (« " + byInd.name + " ») ne concerne pas le DTG : ouverture de « " + opFolder.name + " ».", "run");
  S.d.ref = code + "-" + (opFolder.name.match(/^([A-Z0-9]{1,2})\s*-/i)?.[1] || "").toUpperCase();
  logLine("Indice : " + opFolder.name, "ok");
  const k2 = await listAll(opFolder.path, false, ["folder"]);
  const etude = pick(k2, /ETUDE/i);
  if (!etude) throw { code: "nf", message: "Dossier ETUDE introuvable dans " + (opFolder.path_display || opFolder.name) + "." };
  const k3 = await listAll(etude.path, false, ["folder"]);

  const k4 = await listAll(rv.path, false, ["folder"]);
  const rvs = k4.filter(k => /^RV\s*\d+/i.test(k.name)).sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true }));
  const chosen = rvs.find(k => /^RV\s*1$/i.test(k.name.trim())) || rvs[0] || rv;

}

    if (EXT.img.test(name)) k = "img"; else if (EXT.vid.test(name)) k = "vid"; else if (EXT.txt.test(name)) k = "txt"; else if (EXT.doc.test(name)) k = "doc";

    items.push({ r: rel, k, s: e.file?.size || 0, i: e.file_id || "", p: e.path });
  }
  items.sort((a, b) => a.r.localeCompare(b.r, "fr", { numeric: true }));
  logLine(items.length + " fichiers utiles inventoriés.", "ok");
  return items;
}
const folderOf = rel => { const i = rel.lastIndexOf("/"); return i < 0 ? "" : rel.slice(0, i); };
const baseName = rel => rel.split("/").pop();
const stem = rel => baseName(rel).replace(/\.[^.]+$/, "").toLowerCase();
function invStats() {
  const inv = S.d?.inv || [];
  const folders = new Map();
  for (const it of inv) { const f = folderOf(it.r) || "(racine)"; if (!folders.has(f)) folders.set(f, { img: 0, vid: 0, txt: 0, doc: 0 }); folders.get(f)[it.k]++; }
  const vids = inv.filter(x => x.k === "vid"), txts = inv.filter(x => x.k === "txt");
  const tstems = new Set(txts.map(t => stem(t.r)));
  const missing = vids.filter(v => !tstems.has(stem(v.r)));
  return { folders, vids, txts, missing, imgs: inv.filter(x => x.k === "img"), docs: inv.filter(x => x.k === "doc") };
}
async function fetchText(item) {
  const p = await dbx("fetch", { id: DESKTOP && S.d?.src?.rvPath ? S.d.src.rvPath + "/" + item.r : (item.i || item.p) });
  return (p && typeof p === "object") ? (p.text || "") : String(p || "");
}
async function ensureTranscripts(onProgress) {
  const { txts } = invStats();
  const todo = txts.filter(t => !(t.r in S.transcripts));
  let done = 0;
  const worker = async () => { while (todo.length) { const t = todo.shift(); try { S.transcripts[t.r] = (await fetchText(t)).trim(); } catch (e) { S.transcripts[t.r] = ""; logLine("Lecture impossible : " + t.r, "er"); } done++; onProgress && onProgress(done); } };
  await Promise.all([worker(), worker(), worker(), worker()]);
}
async function ensureDocs() {
  for (const it of (S.d?.inv || []).filter(x => x.k === "doc" && (S.d.docSel || []).includes(x.r))) {
    if (it.r in S.docs) continue;
    if (it.s > MAXDOC) { S.docs[it.r] = ""; continue; }
    try { S.docs[it.r] = (await fetchText(it)).slice(0, 15000); logLine("Document lu : " + baseName(it.r), "ok"); } catch { S.docs[it.r] = ""; logLine("Document illisible : " + baseName(it.r), "er"); }
  }
}

const DTG_REF_EMBED = "TOITURE\nCaractéristiques constructives & matériaux\nBRISIS ZINC / BRISIS ARDOISES\nTERRASSON ZINC / TOITURE TUILES / TOITURE TERRASSE\nSOUCHES\nAccès\nUne échelle d'accès sous cadenas est disponible dans les communs.\nLa trappe d'accès possède un système d'accroche.\nLe châssis d'accès en toiture est en état d'usage / bon état\nAucune échelle d'accès n'est présente.\nLa trappe d'accès n'est pas conforme (dimensions, coupe-feu non assuré, pas de barre d'accroche).\nLe châssis d'accès est vétuste. Les joints mastic des verres sont vétustes, et ne maintiennent plus convenablement les vitrages.\nPRECO \nMettre à disposition des futurs intervenants une échelle d'accès sous cadenas.\nLa trappe d'accès aux combles devra être coupe-feu 1/2h\nUne barre d'accroche sera mise en œuvre afin d'assurer la stabilité de l'échelle.\nLe châssis d'accès en toiture sera entretenu / remplacé.\nUn accès en toiture depuis les communs est obligatoire. Nous préconisons de réaliser un accès aux combles depuis le haut de la cage d’escalier qui permettrai alors l’accès en toiture depuis un châssis.\nFerronnerie\nLa toiture terrasse est correctement sécurisée par des garde‐corps fixés à l’anglaise.  \nLes garde-corps de sécurité commencent à présenter quelques traces de corrosion. \nLes garde-corps métalliques présentent des traces de corrosion avancées. Sans intervention à court terme, ces ouvrages vont rapidement se dégrader.\nLa toiture n’est pas sécurisée, aucun garde-corps ou ligne de vie ne sont présents.\nCharpente - Combles - Description des caractéristiques\nLa toiture est constituée d’une charpente bois traditionnelle.  \nDe nombreux encombrants /gravats sont présents dans les combles. Cela représente un facteur aggravant en cas d'incendie /une surcharge anormale du plancher. De plus, ces gravats sont probablement amiantés.\nEaux pluviales\nDes gouttières à l’anglaise sont présentes en pied de brisis. \nDes gouttières suspendues sont présentes en pied de la couverture zinc. Elles sont en bon état général.\nLes eaux pluviales sont captées sur la toiture terrasse et évacuées par un réseau interne à l'immeuble. \nDes siphons de sols protégés par des grilles sont présents.  \nNous avons constaté que certaines gouttières étaient engorgées, ce qui dégrade d’autant plus les ouvrages à proximité.\nContrat d’entretien en cours\nNous n’avons aucune information sur l’existence ou non d’un contrat d’entretien. L’entretien annuel est essentiel ; il permet d’assurer et de pérenniser l’étanchéité de la toiture. \nLes gestes d’usage à connaitre\nEtat d’entretien général et désordres\nCaractéristiques thermiques\nLa toiture et les combles ne sont pas isolés.\nCompte tenu de l’année de construction de l’immeuble une isolation de la toiture est présente. Toutefois celle-ci est probablement insuffisante au regard des nouvelles normes thermiques. \nLa mise en œuvre d’une isolation des combles impliquera que l’ensemble des gravats soient évacués. Etant donné la présence probable d’amiante, le désamiantage et le nettoyage complet des combles ne pourra s’effectuer que par le terrasson zinc. Par conséquent, les travaux d’isolation des combles sera réalisé lors de la réfection de la toiture. \nTOITURE TERRASSE\nLors de la prochaine réfection de l’étanchéité, l’isolation pourra être améliorer, sous réserve de faisabilité technique (hauteur des relevés, hauteur des garde-corps, etc.)\nRecommandations de travaux\nFACADES XXXX\nCaractéristiques des matériaux existants\nFACADE PLATRE / FACADE PANS BOIS / FACADE BRIQUE / FACADE PIERRE / FACADE BETON / FACADE CIMENT\nDe la végétation se développe en pied de façade. Le joint périmétrique est vétuste. Des infiltrations se produisent entre la façade et le trottoir. \nPIGNONS :\n Nous avons uniquement pu observer en partie le pignon du bâtiment sur rue depuis la rue.  \nLes pignons n’ont pas pu être visités. D’après les vues aériennes ils se composent de maçonneries revêtues d’un enduit bâtard ou ciment.\nUne partie des murs est constitué de boisseaux. \nTravaux : \nIl conviendra de dresser un état sanitaire des murs pignons par une entreprise de travaux à la corde\nDescriptions des ouvrages d’étanchéités \nNous ne relevons pas de désordres particuliers sur les ouvrages d’étanchéité.\nLes protection zincs des éléments saillants (bandeaux, appuis des baies) sont posées en relief (conforme au DTU).\nEn pied de façades, les solins faisant jonction entre les murs et la toiture zinc sont en bon état. \nLes protections zincs des éléments saillants (bandeaux, appuis des baies) sont absentes ou engravées dans les plâtres ce qui n’est pas conforme au DTU.\nLa corniche du R + ….. présente quelques fissurations. Des infiltrations sont probablement en cours depuis l’entablement du R+ ……+1.\nPIGNONS : Nous n’avons aucune visibilité sur les solins en jonction avec les toitures des copropriétés voisines.\nLors du passage des cordistes, l’ensemble des ouvrages de protection et d’étanchéité seront vérifiés.\nFerronnerie\nLes garde-corps métalliques sont en état d’usage / bon état. \nDes garde-corps métalliques sont présents au droit des baies et des balcons. Ces ouvrages sont en bon état apparent.\nLes garde‐corps métalliques présentent des traces de corrosion généralisée. \nLes garde-corps sont instables, il conviendra de vérifier les scellements de toute urgence. \nLes bétons ont éclaté au droit des anciens scellements. \nLes garde-corps ne sont pas conformes aux normes de sécurité.\nLes garde-corps métalliques seront contrôlés (assemblages, soudures, scellement, etc.). Si nécessaire, une lisse haute complémentaire sera mise en œuvre afin d’être conforme en hauteur (1m minimum).\nPIGNONS : Des échelles d’accès aux souches sont présentes.\nMenuiseries\nLes garde-manger sont en mauvais état mais peuvent être restaurés. Ces équipements seront réparés et remis en peinture. Une nouvelle protection zinc sera mise en œuvre.\nLa porte d’entrée présente une altération des peintures, notamment au niveau des zones d’impacts.\nLes lisses bois des garde-corps sont en état d’usage avancé.\nLes peintures bois de certaines baies, des lisses des garde-corps et des garde-manger sont écaillées. Les bois sont à nu et vont s’altérés rapidement. Certaines menuiseries sont déjà trop altérées pour être remplacées.\nEaux pluviales – Eaux usées\nUne descente fonte est présente, elle est en bon état général / état d’usage.  \nLes eaux pluviales sont captées par une descente en zinc sur le côté droit de la façade. Cette descente est en état d’usage.\nLa peinture mise en œuvre sur la descente zinc est vétuste. La descente en elle-même est en état d’usage.\nCertaines descentes fontes sont très fortement corrodée, les joints de liaisons sont vétustes. Des défauts d’étanchéité\n et des écoulements externes sont très probables.  \nElle est fuyarde.\nBalcon – Description et caractéristiques\nLes balcons possèdent une protection plomb. \nLes sols des balcons sont composés d’une étanchéité sur béton recouverte de carrelage.\nLes sous faces sont constituées d’un faux plafond en latte métalliques.\nLes balcons sont dépourvus d’étanchéité. Il en résulte des infiltrations en sous-face qui provoquent des désordres (fissures, épaufrures, décollement des faïences, etc.)\nUn contrôle des protections plomb des balcons sera nécessaire. \nNous constatons des traces marquées notamment au droit des gargouilles d’évacuation. Ces désordres génèrent à terme des épaufrures et des éclats de bétons. \nLa sous face du balcon présente des fissures, des épaufrures... Des infiltrations sont en cours. \nUn contrôle et un entretien des protections plomb et des embases des garde-corps sera nécessaire afin de sauvegarder les ouvrages. \nContrainte de mitoyenneté\nFACADE RUE :\nLa façade est située en limite cadastrale et alignée aux bâtiments voisins. Cette façade visible depuis l’espace public rend la mise en œuvre d’une isolation par l’extérieur difficilement envisageable. Un refus des architectes des Bâtiments de France est fort probable. \nPIGNONS\nLes pignons sont situés en limite cadastrale séparative latérale. Ce sont des limites donnant directement sur les parcelles voisines. Si la copropriété souhaite réaliser des travaux d’isolation par l’extérieur une convention de servitude d’empiètement devra être signée avec les copropriétés voisines. \nLes gestes d’usage à connaitre\nNous rappelons que les jardinières doivent être disposées côté intérieur des garde-corps afin d’éviter leur chute sur la chaussée et le risque de blessures pour les personnes passant sur le trottoir.\nLes baies présentent des persiennes bois dont les peintures sont dégradées. Un entretien à court terme est nécessaire afin de les sauvegarder. Nous rappelons que l’entretien de ces ouvrages est à la charge des propriétaires.\nConcernant l’installation des terminaux ventouses, nous rappelons que leur implantation est soumise au respect des distances minimales définies par l’arrêté du 2 août 1977. Ainsi une distance minimale de 40cm doit être respectée par rapport à toute baie ouvrante latérale, et de 60cm en position frontale. Par ailleurs, le nombre de terminaux autorisés est limité afin de garantir une évacuation conforme et efficace. Dans le cas présent, la cour a une surface au sol de XXXm² et desservant X niveaux, accueille déjà le nombre maximal ? de terminaux admissibles, soit XX unités.\nEtat d’entretien général et désordres\nCaractéristiques thermiques\nLes façades sont isolées.\nCompte tenu de l’époque de construction les façades ne sont pas isolées. Dans le temps des doublages intérieurs ont probablement été mis en œuvre afin d’améliorer l’isolation des logements au cas par cas. \nLes façades ne sont très probablement pas isolées. \nLa façade n’est pas isolée par l’extérieur. Nous n’excluons pas que des isolations par l’intérieur ont pu être réalisées ponctuellement.\nLes balcons et loggias représentent des ponts thermiques importants. \nLors du prochain ravalement et selon les préconisations de l’étude thermique, une isolation par l’extérieur pourra être mise en œuvre avec l’accord des copropriétés voisines. Ces travaux impliqueront des modifications (débords de toiture, raccordement en partie haute, réseaux en façades, garde-corps, persiennes, dépose de volets roulants, etc.). L’ensemble des modénatures, des éléments saillants devront être reconstituées. \nCompte tenu de la qualité architecturale des façades une isolation de la façade par l’extérieur n’est pas envisageable.\nCompte tenu des nombreux balcons, terrasses, loggias et menuiseries une isolation par l’extérieur n’est pas préconisée.\nUne isolation par l’extérieure n’est pas envisageable compte tenu de la présence d’une structure métallique ou de pans bois. Seul un enduit de correction thermique peut être envisagé.\nHALL & CAGE ESCALIER\nCaractéristiques des matériaux existants\nLes sols du hall sont revêtus de carrelage et de ……. en état d’usage / bon état. \nLes paliers et les marches sont en bois revêtus d’un tapis. \nLes murs sont revêtus d’une peinture décorative. (stuc)\nLes plafonds sont en plâtre revêtus d’une peinture. \nLa cage d’escalier est en état d’usage / bon état.\nLes revêtements sont dégradés (présence de fissures, peintures écaillées).\nNous constatons que les revêtements des sols / des murs / des plafonds sont dégradés.\nNous relevons les traces d'anciens dégâts des eaux.\nNous relevons les traces d’un dégât des eaux actif.\nPeintures écaillées ponctuelles si pas besoin d’embellissements :\nIl conviendra d’encapsuler les peintures écaillées si la présence de plomb est avérée. \nMENUISERIES :\nDes infiltrations se produisent au niveau de la baie du …. étage. Les trous de buées sont probablement obstrués.\nPRECO :\nDiligenter une recherche de fuite dans les locaux attenants\nRéaliser les embellissements\nCaractéristiques des parois, portes et accès\nL’accès aux personnes à mobilité réduite est conforme. Depuis le hall, l’accès à l’ascenseur est de niveau\nLa cage d’escalier possède un ascenseur en son centre.\nL’accès nécessite de franchir un escalier de ……. marches. L’accès aux personnes à mobilité réduite n’est donc pas conforme.\nToutefois, depuis le hall, l’accès aux cages d’escaliers et aux ascenseurs est de niveau.\nL’ascenseur est de taille insuffisante pour les fauteuils roulants.\nLes normes d’accessibilité PMR ne sont pas conformes. Toutefois, aucune obligation n’impose la mise en conformité (seul une réhabilitation dont le montant est supérieur ou égal à 80% de la valeur du bâtiment en lui-même ou des travaux impactant les volumes existants l’impose).\nPrésence matériaux à risques\nNous n’avons pas constaté de présence manifeste de matériaux à risque. \nLa présence de plomb dans les peintures n’est pas à exclure. Il conviendra de réaliser un DAT lorsque les travaux d’embellissements seront envisagés par la copropriété. \nInstallations électriques et éclairage\nLes points d'éclairages sont bien protégés par des hublots. \nL'installation électrique est conforme (passage des fils sous gaine rigide de protection ou sont encastrés).\nLe tableau électrique est conforme à la réglementation\nLes réseaux faibles sont convenablement positionnés.\nLa ligne de terre a été repérée.\nLe tableau électrique est ancien, il comporte encore quelques anciens fusibles.\nLes tableaux électriques sont non conformes (coffret métallique, hauteur trop basse).\nLes points lumineux ne sont pas protégés (ampoules à nu)\nLe réseau électrique n'est pas convenablement protégé (fils à nu)\nAucune ligne de terre n'a été repérée\nLes réseaux faibles sont positionnés de manière anarchique.\nPRECO :\nRemplacer les fusibles par des disjoncteurs. \nL'ensemble des installations électriques seront mises aux normes (tableaux secondaires, câblages sous gaine, points lumineux protégés par hublots, etc.)\nUne ligne de terre sera mise en place et desservira l'ensemble des paliers de la cage d'escalier.\nCompte tenu de la surface des caves, il conviendra de procéder à la mise en place de blocs autonomes de sécurité sur l’ensemble des cheminements des caves jusqu’aux sorties\nLes anciens coffrets électriques devront être contrôlés et mis aux normes. Ces travaux peuvent être envisagés dans le cadre de la loi ELAN.\nRéseaux d’évacuation et d’adduction\nEAU POTABLE\n+ + + \nLe réseau d'adduction en eau potable est conforme en cuivre.\n- - -\nLe réseau d'adduction en eau potable est non conforme, il présente des portions encore en plomb.\n/ / /\nIl conviendra de supprimer toutes les anciennes conduites en plomb et de les remplacer par du cuivre.\nNous rappelons les effets sur la santé du plomb : \nL'ingestion ou l'inhalation du plomb peut avoir divers effets toxiques aigus (anémie, troubles digestifs) et chroniques (atteintes du système nerveux).\nLes enfants, et plus particulièrement ceux âgés de moins de 6 ans, ainsi que les femmes enceintes constituent la population la plus exposée au risque d'intoxication par le plomb.\nCette intoxication, appelée saturnisme, entraîne des troubles à l'acquisition de certaines fonctions cérébrales supérieures et peut être la cause de retards intellectuels, de difficultés d'apprentissage, de troubles psychomoteurs, de troubles de l’attention, d'irritabilités, de troubles du sommeil et même d’un ralentissement de la croissance.\nEAUX USEES\n+ + +\nLes descentes d'eaux usées sont en fonte / PVC en état d'usage.\nNous ne relevons aucune défaillance particulière.\n- - -\nLes descentes d'eaux usées en fonte sont corrodées et les joints sont vétustes. \nLes réseaux sont anciens, et vont à court ou moyen terme devenir fuyards.\nLes réseaux sont fuyards, nous relevons plusieurs fuites actives.\nNous constatons la présence de fontis (affaissement du sol). Certains réseaux enterrés sont très probablement fuyards.\n/ / / \nIl conviendra de \nRéaliser à moyen terme la passivation et l’entretien des descentes fontes\nDiligenter une campagne d'entretien et de passivation de l'ensemble des réseaux fonte.\nProcéder à l'entretien des réseaux (passivation) et au remplacement des portions fuyardes.\nRéaliser un contrôle caméra de l'ensemble des réseaux aériens / enterrés afin de déterminer les portions défaillantes.\nRemplacer les réseaux enterrés défaillants.\nRéseau gaz\nLes réseaux gaz sont présents à tous les étages. Ils sont situés en gaines techniques dédiées et ventilées. Les réseaux sont peints en jaune. \nLe réseau gaz n’a pas été remplacé. S’il est toujours actif, il conviendra de faire intervenir GRDF afin de mettre aux normes les installations.\nRéglementation incendie\nLe plan d'évacuation est bien présent et correctement affiché.\nLa cage d'escalier est naturellement ventilée (conforme à la réglementation incendie).\nLe plan d'évacuation n'est pas affiché dans le hall d'entrée (réglementation incendie)\nLa cage d'escalier n'est pas ventilée en partie haute (désenfumage), et ne possède aucune ouverture sur l'extérieur. Toutefois des extincteurs sont présents.\nCertaines fenêtres des logements s’ouvrent dans la cage d’escalier (non conforme à la réglementation incendie). En cas d’incendie dans un appartement la fumée va se propager dans la cage d’escalier.\nPRECO :\nMettre en place un plan d'évacuation conforme à la réglementation.\nDe mettre en œuvre un châssis de désenfumage (1m²) en partie haute de la cage d'escalier, asservi depuis le rez-de-chaussée.\nVentilations\nDes extracteurs d’air ponctuels sont présents dans certaines salles de bains. Il est rappelé que ces dispositifs ont pour seule fonction l’évacuation des odeurs et ne permettent pas un traitement efficace de l’humidité.\nIl convient de prévoir la mise en place d’un système de ventilation mécanique contrôlée (VMC), de type hygroréglable ou à fonctionnement continu, correctement dimensionné. Celui-ci devra comporter des entrées d’air dans les pièces principales et des bouches d’extraction dans les pièces humides. Par ailleurs, les portes des chambres et des pièces principales devront être convenablement étalonnées, afin de permettre une circulation d’air efficace au sein les logements.\nSeule une installation correctement mise en œuvre permet de traiter durablement les problématiques d’humidité. \n(VOIR PARAGRAPHE VENTILATION DES COMMUNS CHAPITRE ZONES COMMUNES)\nLes gestes d’usage à connaitre\nNous constatons des traces récurrentes d’anciens dégâts des eaux provenant des salles de bains attenantes à la cage d’escalier.\nNous rappelons qu’une étanchéité sous le carrelage est obligatoire dans les salles de bains. Le carrelage et les joints n’assurent pas ce rôle. Nous invitons donc les copropriétaires à faire réaliser des travaux conformes lors des rénovations. \nUn extincteur est présent, nous rappelons que seules les personnes ayant suivi une formation sont habilitées à s’en servir. De plus aucune signalisation n’est affichée.\nEtat d’entretien général et désordres\nCaractéristiques thermiques\nLocal non chauffé\nRecommandations de travaux\nPASSAGE COCHER\nCaractéristiques des matériaux existants\nLes plafonds et les murs sont en plâtre revêtus d’une peinture. Le sol est pavé.\nLes peintures sont écaillées au niveau de l’accès à la cour sur la droite. \nPrésence matériaux à risques\nLes peintures sont écaillées, la présence de plomb est probable.\nInstallations électriques et éclairage\nL’installation électrique est conforme.\nEtat d’entretien général et désordres\nCaractéristiques thermiques\nLe plancher haut n’est pas isolé ; son isolation est envisageable elle permettrait d’améliorer l’enveloppe thermique des appartements du R+1.\nToutefois, des portes ferment le passage cocher et permettent de limiter les déperditions des appartements du R+1.\nRecommandations de travaux\nIl conviendra d’encapsuler les peintures écaillées si la présence de plomb est avérée. \nA moyen ou long terme, nous préconisons de mettre en œuvre l’isolation du plancher haut.\nCAVES\nCaractéristiques des caves\nPLANCHER HAUT\nLe plancher haut est composé de profilés métalliques de type IAO et de hourdis en plâtre en état d'usage.\nLe plancher haut des caves est composé de profilés métalliques de type IAO et de voûtains en briques en état d'usage.\nLe plancher haut des caves a déjà fait l'objet d'un confortement en sous face. Ce dernier est en bon état.\nLes planchers des caves sont constitués de dalles en bétons supportées par un système de poteau / poutre béton en état d’usage.\nPLANCHER HAUT \nLes profilés métalliques sont corrodés, et les hourdis plâtre commencent à se fissurer.\nLes profilés métalliques sont fortement corrodés, et les hourdis plâtre sont devenus instables.\nLes profilés métalliques sont corrodés, certains voûtains brique présentent des épaufrures et des joints dégarnis.\nDALLE BETON SOL\nUne dalle béton est présente au sol, ce qui dégrade l’hygrométrie et bloque le transfert d’humidité. Les cloisons des caves sont altérées par l’humidité.\nPRECO : Purger la dalle béton en pourtour des cloisons afin de restaurer l’échange hygrométrique.\nPRECO PLANCHER HAUT :\nDiligenter une campagne de passivation de tous les éléments métalliques et d'entretien des hourdis / voûtains\nPassiver l'ensemble des profilés métalliques et de réaliser des renforcements ponctuels pour les éléments les plus dégradés. Les hourdis plâtre instables seront purgés et reconstitués\nRéaliser un sous-plancher de confortement (plancher dit à l'\"italienne\"). Ces travaux nécessitent le dévoiement des réseaux présents en partie haute.\nCloisonnement caves individuelles\nLes cloisons des caves privatives sont constituées de maçonneries de briques et de porte en bois ou métallique. \nLes cloisons de caves privatives sont constituées de parpaings creux et de porte en bois ou métallique.\nLes portes privatives des caves en bois sont fortement altérées par la présence d'insectes xylophages (vrillettes)\nPRECO:\nProcéder à un traitement général de tous les bois présents en cave\nCaractéristiques des portes & accès\nLa porte d’accès aux caves est conforme à la réglementation incendie (coupe-feu). \nLe verrou possède un bouton moleté côté caves (conforme).\nLa sous face de la volée d’escalier supérieure est bien protégée (sous face plâtre)\nSi local ascenseur ou chaufferie (code du travail) :\nUne main courante est bien présente, ainsi que des éclairages de sécurité\nLa porte d’accès n’est pas coupe-feu (ventilations présentes – porte métallique)\nLe verrou n’est pas conforme ; il ne permet pas un déverrouillage sans clef depuis l’intérieur des caves.\nLa sous face de la volée d’escalier supérieure n’est pas protégée contre le feu.\nEn cas d'incendie dans les caves, le feu pourrait rapidement se propager dans le hall et la cage d'escalier.\nCompte tenu de la présence du local ascenseur / chaufferie, une main courante et un éclairage de sécurité sont obligatoire dans l'escalier et les circulations des caves (code du travail).\nPRECO:\nModifier la porte actuelle en obstruant les ventilations présentes\nRemplacer la porte actuelle par une porte ayant un degré pare feu de 1/2H (RE30)\nMettre en place un bouton moleté sur la serrure côté caves\nRéaliser une protection au feu en plâtre de la volée supérieure\nMettre en place une main courante\nMettre en place un éclairage de sécurité entre les locaux techniques et l'escalier des caves\nPrésence matériaux à risques\nInstallations électriques et éclairage\nLes points d'éclairages sont bien protégés par des hublots. \nL'installation électrique est conforme (passage des fils sous gaine rigide de protection ou sont encastrés).\nLe tableau électrique est conforme à la réglementation\nLes réseaux faibles sont convenablement positionnés.\nLe tableau électrique est ancien, il comporte encore quelques anciens fusibles.\nLe tableau électrique est non conforme (coffret métallique).\nLes points lumineux ne sont pas protégés (ampoules à nu)\nLe réseau électrique n'est pas convenablement protégé (fils à nu)\nAucune ligne de terre n'a été repérée\nLes réseaux faibles sont positionnés de manière anarchique.\nPRECO :\nRemplacer les fusibles par des disjoncteurs. \nL'ensemble des installations électriques seront mises aux normes (tableaux secondaires, câblages sous gaine, points lumineux protégés par hublots, etc.)\nUne ligne de terre sera mise en place et desservira l'ensemble des paliers de la cage d'escalier.\nCompte tenu de la surface des caves, il conviendra de procéder à la mise en place de blocs autonomes de sécurité sur l’ensemble des cheminements des caves jusqu’aux sorties\nLes anciens coffrets électriques devront être contrôlés et mis aux normes. Ces travaux peuvent être envisagés dans le cadre de la loi ELAN.\nRéseaux d’évacuation et d’adduction\nEAU POTABLE\n+ + + \nLe réseau d'adduction en eau potable est conforme en cuivre.\n- - -\nLe réseau d'adduction en eau potable est non conforme, il présente des portions encore en plomb.\n/ / /\nIl conviendra de supprimer toutes les anciennes conduites en plomb et de les remplacer par du cuivre.\nNous rappelons les effets sur la santé du plomb : \nL'ingestion ou l'inhalation du plomb peut avoir divers effets toxiques aigus (anémie, troubles digestifs) et chroniques (atteintes du système nerveux).\nLes enfants, et plus particulièrement ceux âgés de moins de 6 ans, ainsi que les femmes enceintes constituent la population la plus exposée au risque d'intoxication par le plomb.\nCette intoxication, appelée saturnisme, entraîne des troubles à l'acquisition de certaines fonctions cérébrales supérieures et peut être la cause de retards intellectuels, de difficultés d'apprentissage, de troubles psychomoteurs, de troubles de l’attention, d'irritabilités, de troubles du sommeil et même d’un ralentissement de la croissance.\nEAUX USEES\n+ + +\nLes descentes d'eaux usées sont en fonte / PVC en état d'usage.\nNous ne relevons aucune défaillance particulière.\n- - -\nLes descentes d'eaux usées en fonte sont corrodées et les joints sont vétustes. \nLes réseaux sont anciens, et vont à court ou moyen terme devenir fuyards.\nLes réseaux sont fuyards, nous relevons plusieurs fuites actives.\nNous constatons la présence de fontis (affaissement du sol). Certains réseaux enterrés sont très probablement fuyards.\n/ / / \nIl conviendra de \nRéaliser à moyen terme la passivation et l’entretien des descentes fontes\nDiligenter une campagne d'entretien et de passivation de l'ensemble des réseaux fonte.\nProcéder à l'entretien des réseaux (passivation) et au remplacement des portions fuyardes.\nRéaliser un contrôle caméra de l'ensemble des réseaux aériens / enterrés afin de déterminer les portions défaillantes.\nRemplacer les réseaux enterrés défaillants.\nCaractéristiques de la ventilation des locaux \nLes ventilations naturelles sont fonctionnelles et assurent un bon renouvellement d'air frais et maintiennent une hygrométrie basse.\nLes caves sont convenablement ventilées, nous ne relevons pas d’humidité anormale.\nNous relevons une hygrométrie anormalement haute dans les caves. Une ou plusieurs ventilations naturelles ont été obstruée dans le passé. De fait il n'existe plus aucun mouvement d'air frais, et l'humidité dégrade le plancher haut et les maçonneries.\nPRECO:\nContrôler et rouvrir les ventilations naturelles\nMettre en œuvre une VMC afin de souffler un air frais et ainsi recréer un mouvement d'air efficace qui permettra d'abaisser significativement l'humidité ambiante.\nRéseau gaz\nLe réseau de gaz est présent, il est en bon état et clairement identifié.\nRéglementation incendie\nLe plan de sécurité est affiché.\nNous relevons la présence d’extincteurs et de boitier de coupure.\nDes blocs autonomes de sécurité sont présents et permettent de guider les personnes vers les sorties.\nLes caves ne sont actuellement pas équipées de BAES (Blocs Autonomes d’Éclairage de Sécurité). Bien que leur installation ne soit pas légalement obligatoire, leur mise en place est fortement recommandée afin d’assurer un éclairage minimal en cas de coupure de courant, notamment pour faciliter l’évacuation ou l’intervention en sécurité dans ces espaces enclavés et peu éclairés. \nAucun éclairage de sécurité n'est présent (surface des caves > à 100m²).\nLes gestes d’usage à connaitre\nNous constatons que de nombreux encombrants sont stockés dans les caves ce qui représente un risque aggravant en cas d'incendie, et génère de l'insalubrité (humidité, nuisibles, développement de lignivores, etc.)\nPRECO:\nDiligenter une campagne de dératisation\nEvacuer les encombrants\nEtat d’entretien général et désordres\nCaractéristiques thermiques\nLa sous-face du plancher haut n’est pas isolée.\nUne isolation en sous face est techniquement réalisable. Toutefois cette opération nécessite de nombreux travaux induits, tels que le dévoiement de tous les réseaux en sous face (adduction d’eau, descente d’eau, électricité, etc.), ce qui représentera un coût non négligeable.\nDe plus cela masquera d’éventuel désordres structurels dans le futur, qui ne pourront être pris en charge à temps.\nPour ces deux raisons, nous ne préconisons pas la réalisation d’isolation en sous face. En revanche nous invitons les copropriétaires à systématiquement isoler les sols des logements du rez-de-chaussée lors des rénovations importantes des logements.\nUne isolation en sous face est techniquement réalisable. Toutefois cette opération nécessite de nombreux travaux induits, tels que le dévoiement de tous les réseaux en sous face, ce qui représentera un coût non négligeable. De plus cela pourrait masquer d’éventuels désordres structurels dans le futur.\nIl conviendra donc avant tout travaux d’isolation de s’assurer que le plancher haut des caves est sain et que les pièces humides du R+1 donnant sur ce plancher soit réputées étanches.\n//////\nLe plancher haut des caves est composée de béton revêtu d’un flocage coupe-feu et thermique.\nDes plaques fibrées isolante sont présentes en sous-face du plancher haut.\nCompte tenu de la structure béton du plancher et des hauteurs disponibles, une isolation de la sous face par flocage est envisageable. Cela sous-entend de dévoyer les réseaux accrochés en sous-face.\nSTATIONNEMENT\nCaractéristiques techniques\nLe parking est constitué d’une structure en béton armé. \nLes dalles bétons sont supportées par un système poteau / poutre béton. \nLes sous-sols sont bâtis en voiles et dalles béton. \nNous ne relevons aucune altération structurelle.\nLes joints de fractionnement sont en état d’usage.\nDe nombreuses grilles et collecteurs permettent de récupérer les eaux de ruissellements. \nLes sols en béton sont fissurés, ce qui peut générer des infiltrations sous la dalle.\nLes murs périphériques, les sols et les plafonds présentent des fissures infiltrantes (traces de suintements et de calcite).\nLes joints de dilatation ne sont pas correctement entretenus, certains joints souples ont disparu. De fait les eaux de ruissellements se propagent d’étages en étages. \nAucun système de récupération des eaux de ruissellement n’est présent.\nPRECO :\nEntretenir les joints de fractionnement au sol afin d’éviter des infiltrations dans la dalle\nMise en œuvre de cunettes afin de récupérer les eaux\nRampes d’accès véhicules, sorties piétons \nUn sas permet aux piétons d’accéder au parking. La porte est conforme à la réglementation incendie (coupe-feu).\nLa rampe d’accès des véhicules est conforme. Un portail aux normes est en fonctionnement.\nUn caniveau se situe en bas de la rampe d’accès.\nCloisonnement boxes individuelles\nLes box individuels sont composés de portes métalliques et de cloisons séparatives en maçonneries de blocs béton creux. Ces ouvrages sont en état d’usage. \nInstallations électriques et éclairages \nLes points d'éclairages sont bien protégés par des hublots. \nL'installation électrique est conforme (passage des fils sous gaine rigide de protection ou sont encastrés).\nLe tableau électrique est conforme à la réglementation\nLes réseaux faibles sont convenablement positionnés.\nLe tableau électrique est ancien, il comporte encore quelques anciens fusibles.\nLe tableau électrique est non conforme (coffret métallique).\nLes points lumineux ne sont pas protégés (ampoules à nu)\nLe réseau électrique n'est pas convenablement protégé (fils à nu)\nAucune ligne de terre n'a été repérée\nLes réseaux faibles sont positionnés de manière anarchique.\nPRECO :\nRemplacer les fusibles par des disjoncteurs. \nL'ensemble des installations électriques seront mises aux normes (tableaux secondaires, câblages sous gaine, points lumineux protégés par hublots, etc.)\nUne ligne de terre sera mise en place et desservira l'ensemble des paliers de la cage d'escalier.\nCompte tenu de la surface des caves, il conviendra de procéder à la mise en place de blocs autonomes de sécurité sur l’ensemble des cheminements des caves jusqu’aux sorties\nLes anciens coffrets électriques devront être contrôlés et mis aux normes. Ces travaux peuvent être envisagés dans le cadre de la loi ELAN.\nRéseaux d’évacuation et d’adduction\nEAU POTABLE\n+ + + \nLe réseau d’adduction en eau potable est en cuivre, et alimente un robinet de puisage destinées au nettoyage.\n- - -\nLe réseau d'adduction en eau potable est non conforme, il présente des portions encore en plomb.\n/ / /\nIl conviendra de supprimer toutes les anciennes conduites en plomb et de les remplacer par du cuivre.\nNous rappelons les effets sur la santé du plomb : \nL'ingestion ou l'inhalation du plomb peut avoir divers effets toxiques aigus (anémie, troubles digestifs) et chroniques (atteintes du système nerveux).\nLes enfants, et plus particulièrement ceux âgés de moins de 6 ans, ainsi que les femmes enceintes constituent la population la plus exposée au risque d'intoxication par le plomb.\nCette intoxication, appelée saturnisme, entraîne des troubles à l'acquisition de certaines fonctions cérébrales supérieures et peut être la cause de retards intellectuels, de difficultés d'apprentissage, de troubles psychomoteurs, de troubles de l’attention, d'irritabilités, de troubles du sommeil et même d’un ralentissement de la croissance.\nEAUX USEES\n+ + +\nLes descentes d'eaux usées sont en fonte / PVC en état d'usage.\nNous ne relevons aucune défaillance particulière.\n- - -\nLes descentes d'eaux usées en fonte sont corrodées et les joints sont vétustes. \nLes réseaux sont anciens, et vont à court ou moyen terme devenir fuyards.\nLes réseaux sont fuyards, nous relevons plusieurs fuites actives.\nNous constatons la présence de fontis (affaissement du sol). Certains réseaux enterrés sont très probablement fuyards.\n/ / / \nIl conviendra de \nRéaliser à moyen terme la passivation et l’entretien des descentes fontes\nDiligenter une campagne d'entretien et de passivation de l'ensemble des réseaux fonte.\nProcéder à l'entretien des réseaux (passivation) et au remplacement des portions fuyardes.\nRéaliser un contrôle caméra de l'ensemble des réseaux aériens / enterrés afin de déterminer les portions défaillantes.\nRemplacer les réseaux enterrés défaillants.\nCaractéristiques de la ventilation des locaux \nLe parking est naturellement ventilé en façade. \nLes ventilations sont fonctionnelles.\nL’extraction d’air est en fonctionnement.\nRéseau gaz\nLe réseau de gaz est présent, il est en bon état et clairement identifié.\nRéglementation incendie\nDes blocs autonomes de sécurité sont présents.\nNous avons repéré le bac à sable avec son sot et sa pelle. \nLes plans de sécurité sont affichés.\nLes gestes d’usage à connaitre\nEtat d’entretien général et désordres\nCaractéristiques thermiques\nLes réseaux de chauffage est d’eau chaude sanitaire sont isolés.\nLe plancher bas du rez-de-chaussée est floqué.\nAucune isolation n’est présente en sous face du plancher haut du premier sous-sol.\nCompte tenu de la structure béton du plancher et des hauteurs disponibles, une isolation de la sous face par flocage est envisageable. Cela sous-entend de dévoyer les réseaux accrochés en sous-face.\nRecommandations de travaux\nLOCAL POUBELLE\nCaractéristiques des matériaux existants\n Le local poubelle est situé dans …… . \nL’accès s’effectue depuis ……. .\nLe sol est composé d’une dalle brute …\nUn siphon de sol et un point d’eau sont présents. Le sol est lavable.\nLe sol n’est pas étanché.\nLes murs ne sont pas revêtus de protection.\nPRECO :\nMise en œuvre d’une étanchéité au sol et sur les murs. \nMise en œuvre de revêtements de protections sur les sol et murs. \nInstallation d’un point d’eau et d’un siphon de sol (raccordé au réseau d’évacuation des eaux usées).\nProcéder à la réfection du local poubelle\nCréer un local poubelle répondant aux normes incendie et au règlement sanitaire de la ville\nPrésence matériaux à risques\nNous n’avons pas constaté de présence manifeste de matériaux à risque. \nLa présence de plomb dans les peintures n’est pas à exclure. Il conviendra de réaliser un DAT lorsque ses travaux seront envisagés.\nRéglementation incendie\nLa porte est coupe-feu et munie d’un ferme porte. Elle est maintenue fermée \n/// L’abri poubelles est situé à l’extérieur et à bonne distance de toute fenêtre ou issue.\nLa porte n’est pas coupe-feu. Elle n’est pas maintenue fermée.\nUne baie est présente à proximité.\nAucunes ventilations ne sont présentes.\nPRECO\nInstaller une porte coupe-feu muni d’un ferme porte\nCOUR\nCaractéristiques des matériaux existants\nLa cour centrale est composée d’une dalle béton revêtue…\nLes joints de dilatation sont ….\nLe sol de la cour centrale est composé de pavés de pierre avec des joints maçonnées en état d’usage.\nLe sol de la cour est composé d’une dalle béton brut sur terre-plein.\nElle présente de nombreuses fissurations.  Des infiltrations sont en cours. Aucunes caves n'étant présentent en sous-sol, les désordres générés sont uniquement au niveau de la dalle de la cour.  De la végétation parasite est présente (mousses).\nElle présente un affouillement au niveau du siphon de sol. Des infiltrations sont en cours.\nGestion des eaux pluviales\nLes eaux pluviales sont captées par des siphons de sol.\nLes eaux pluviales s’infiltrent directement dans le sol.\nLes siphons de sol sont à contrôler. \nLes eaux pluviales s'évacuent en majeur partie dans les siphons. De l'eau pénètre dans la dalle et s'infiltre dans le sous-sol. A terme des décompressions de sol peuvent apparaitre. ";

function txLines(rel) { return (S.transcripts[rel] || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean); }
function tsOf(line) { const m = line.match(/^\[?(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,]\d+)?\]?/); return m ? (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) : null; }
function txMap() { S.d.txmap = S.d.txmap || {}; return S.d.txmap; }
function txEntry(rel) {
  const m = txMap(); let e = m[rel];
  if (!e) { const n = txLines(rel).length || 99999; e = m[rel] = { status: "new", resume: "", segs: [{ a: 1, b: n, chaps: [], sujet: "", certain: false }] }; }
  return e;
}
function chapterSegs(id) {
  const out = [];
  for (const [rel, e] of Object.entries(S.d?.txmap || {})) { if (e.status === "ignore" || e.status === "empty") continue; e.segs.forEach((s, i) => { if (!s.ignore && s.chaps.includes(id)) out.push({ rel, i, ...s }); }); }
  return out;
}
function pendingTx() { return Object.entries(S.d?.txmap || {}).filter(([, e]) => e.status === "ask").map(([r]) => r); }
function fixCoverage(e, n) {
  const segs = (e.segs || []).filter(s => s.a >= 1 && s.a <= n).map(s => ({ ...s, b: Math.min(Math.max(s.b || s.a, s.a), n) })).sort((x, y) => x.a - y.a);
  const out = []; let next = 1;
  for (const s of segs) { if (s.a < next) s.a = next; if (s.a > s.b) continue; if (s.a > next) { if (s.a - next <= 2 && out.length) out[out.length - 1].b = s.a - 1; else if (s.a - next <= 2) s.a = next; else out.push({ a: next, b: s.a - 1, chaps: [], sujet: "Passage non classé", certain: false }); } out.push(s); next = s.b + 1; }
  if (next <= n) { if (n - next < 2 && out.length) out[out.length - 1].b = n; else out.push({ a: next, b: n, chaps: [], sujet: "Passage non classé", certain: false }); }
  if (!out.length) out.push({ a: 1, b: Math.max(1, n), chaps: [], sujet: "", certain: false });
  e.segs = out;
}
function computeStatus(e) { e.status = e.segs.every(s => s.ignore || (s.certain && s.chaps.length)) ? "auto" : "ask"; }
function migrateTx() {
  if (!S.d) return;
  for (const c of Object.values(S.chaps)) {
    if (c.tx && c.tx.length) { for (const rel of c.tx) { const e = txEntry(rel); e.segs.forEach(s => { if (!s.chaps.includes(c.id)) s.chaps.push(c.id); }); if (e.status === "new") e.status = "done"; } c.tx = []; queueSave(c.id); queueSave("d"); }
  }
}

function applyTxAnalysis(list, kmap) {
  for (const t of (Array.isArray(list) ? list : [])) {
    const rel = S._tmap[t.id]; if (!rel) continue;
    const n = txLines(rel).length;
    const e = txMap()[rel] = { status: "ask", resume: String(t.resume || ""), segs: [] };
    for (const p of (t.passages || [])) {
      const [a, b] = Array.isArray(p.lignes) ? p.lignes.map(Number) : [1, n];
      const chaps = (p.chapitres || []).map(k => kmap[k]).filter(Boolean);
      e.segs.push({ a: a || 1, b: b || a || 1, chaps, sujet: String(p.sujet || ""), certain: !!p.certain && chaps.length > 0, ignore: !!p.horssujet && !chaps.length, sugg: chaps.slice() });
    }
    fixCoverage(e, n); computeStatus(e);
  }
}
async function analyzeTranscripts(mode) {

  }

function sampleError(e) {
  const c = e?.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed") return "L’assistant IA n’est pas autorisé pour cette page.";
  if (c === "rate_limited") return "Limite d’utilisation atteinte. Réessayez plus tard.";
  if (c === "prompt_too_large") return "Trop de texte envoyé à l’IA : réduisez les transcriptions associées au chapitre.";
  if (c === "invalid_json") return "La réponse de l’IA était mal formée. Relancez la rédaction.";
  if (c === "session_expired") return "Session expirée : reconnectez-vous à claude.ai.";
  if (c === "cancelled") return "Interrompu.";
  return "L’assistant IA a rencontré une erreur. Relancez.";
}
async function draftChapter(id, signal) {
  const c = S.chaps[id]; const b = S.d.buildings.find(x => x.chapters.includes(id));
  if (!c || !b) return;
  if (c.type === "VENTILATION") return;
  await ensureTranscripts(); await ensureDocs();
  const opts = { modelTier: "default" }; if (signal) opts.signal = signal;
  const j = await SAMPLE.json(chapterPrompt(b, c), opts);
  const rub = j?.rubriques || {};
  const keys = Object.keys(rub); const nk = keys.map(norm);
  for (const f of c.fields) {
    const k = keys[nk.indexOf(norm(f.label))];
    if (k !== undefined && typeof rub[k] === "string") f.paras = markedToParas(rub[k]);
  }
  if (ETATS.some(e => e[0] === j?.etat)) c.etatGen = j.etat;
  const cot = j?.cotations || {};
  const map = { a: cot.archi, t: cot.thermique, e: cot.ete };
  for (const k of (TYPES[c.type]?.cot || [])) { const v = Number(map[k]); c.cot[k] = v >= 1 && v <= 3 ? v : null; }
  c.state = "ia"; queueSave(id);
}
async function draftAll() {
  if (!SAMPLE) return toast("Assistant IA indisponible dans cette vue.");
  const list = allChapters().filter(({ c }) => c.type !== "VENTILATION");
  if (!list.length) return toast("Aucun chapitre : proposez d’abord la structure.");
  const pend = pendingTx();
  if (pend.length) {
    const r = await ask(pend.length + " transcription(s) vidéo ne sont pas encore identifiées : leur contenu ne sera pas utilisé.", [["Identifier maintenant", "id"], ["Rédiger quand même", "go"], ["Annuler", "n"]]);
    if (r === "id") return openIdentify(pend, 0);
    if (r !== "go") return;
  }
  let only = "all";
  if (list.some(({ c }) => c.state !== "vide")) {
    only = await ask("Certains chapitres sont déjà rédigés.", [["Rédiger seulement les vides", "empty"], ["Tout réécrire", "all"], ["Annuler", "n"]]);
    if (only === "n" || !only) return;
  }
  S.busy = "draft"; S.abort = new AbortController(); renderSources();
  for (const { b, c } of list) {
    if (S.abort.signal.aborted) break;
    if (only === "empty" && c.state !== "vide") continue;
    logLine("Rédaction : " + b.name + " › " + c.title + "…", "run");
    try { await draftChapter(c.id, S.abort.signal); logLine("Rédigé : " + b.name + " › " + c.title, "ok"); }
    catch (e) { logLine(c.title + " : " + sampleError(e), "er"); if (e?.code === "not_granted" || e?.code === "rate_limited") break; }
    renderTree();
  }
  S.busy = null; renderAll();
}

/* ============ dossier open ============ */
async function openDossier(ref) {
  ref = String(ref || "").trim().toUpperCase(); if (!ref) return;
  S.busy = "open"; S.log = []; renderSources();
  const reset = () => { S.imgs = {}; S.calHits = null; S.betProposal = null; S.chaps = {}; S.transcripts = {}; S.docs = {}; S.photos = new Map(); S.selPhotos.clear(); };
  const adopt = (slug, got) => { reset(); S.slug = slug; S.d = got.d; S.chaps = got.chaps || {}; logLine("Dossier repris : " + S.d.ref, "ok"); };
  try {
    let slug = slugOf(ref);
    const got = await Store.load(slug);
    if (got?.d) adopt(slug, got);
    else {
      reset(); S.slug = null;
      S.d = { ref, slug, meta: { adresse: "", date: "", version: "1" }, buildings: [], inv: [], docSel: [], src: null };
      const loc = await locateDossier(ref);           // fixe S.d.ref = CODE-INDICE du dossier DTG
      slug = slugOf(S.d.ref);
      const got2 = slug !== slugOf(ref) ? await Store.load(slug) : null;
      if (got2?.d) adopt(slug, got2);
      else {
        S.slug = slug; S.d.slug = slug;
        S.d.src = { root: loc.root.path_display, op: loc.opFolder.path_display || "", rvPath: loc.chosen.path, rvDisplay: loc.chosen.path_display || "", rvName: loc.chosen.name, rvs: loc.rvs.map(r => ({ name: r.name, path: r.path, disp: r.path_display || "" })) };
        S.d.inv = (await scanRV(loc.chosen.path)).map(({ r, k, s, i }) => ({ r, k, s, i }));
        S.d.docSel = S.d.inv.filter(x => x.k === "doc" && x.s && x.s <= MAXDOC && !/DTG/i.test(x.r)).map(x => x.r);
        const b = { id: "b" + uid(), name: "BATIMENT A", chapters: [] };
        S.d.buildings = [b];
        for (const t of V7_CHAPTERS) { const c = newChapter(t); S.chaps[c.id] = c; b.chapters.push(c.id); }
        queueSave("d"); Object.keys(S.chaps).forEach(id => queueSave(id));
      }
    }
    S.lastSaved = Math.max(S.d.updatedAt || 0, ...Object.values(S.chaps).map(c => c.updatedAt || 0)) || null; showLastSaved();
    migrateTx();
    if (DESKTOP && S.d.src) {
      const fix = s => (s && s.path && /^ns:/.test(s.path) && s.disp) ? { ...s, path: s.disp } : s;
      if (/^ns:/.test(S.d.src.rvPath || "") && S.d.src.rvDisplay) S.d.src.rvPath = S.d.src.rvDisplay;
      S.d.src.rvs = (S.d.src.rvs || []).map(fix);
      scanRV(S.d.src.rvPath).then(items => { S.d.inv = items.map(({ r, k, s, i }) => ({ r, k, s, i })); S.photos = new Map(); queueSave("d"); renderAll(); }).catch(e => logLine("Dossier de visite introuvable sur ce poste : " + (e?.message || ""), "er"));
    }
    for (const c of Object.values(S.chaps)) for (const f of c.fields) if (isNoInfo(f.paras)) { f.paras = []; queueSave(c.id); }
    S.sel = S.d.buildings[0]?.chapters[0] || null;
    loadStyleRefs(false).then(renderSources);
    refreshTrashCount();
  } catch (e) { logLine(e?.code === "nf" ? e.message : mcpMessage(e), "er"); if (!S.d?.src) { S.slug = null; S.d = null; } }
  S.busy = null; recentCache = null; renderAll();
}

async function createDtg(f) {
  S.busy = "open"; S.log = []; renderSources();
  S.imgs = {}; S.calHits = null; S.betProposal = null; S.chaps = {}; S.transcripts = {}; S.docs = {}; S.photos = new Map(); S.selPhotos.clear();
  try {
    const slug = slugOf(f.ref); S.slug = slug;
    S.d = { ref: f.ref, slug, meta: { adresse: f.adresse, date: f.date, version: f.version }, buildings: [], inv: [], docSel: [], src: null };
    const names = f.bats ? f.bats.split(/[,;]+/).map(x => x.trim()).filter(Boolean) : [];
    const list = names.length ? names.map(n => /^bat/i.test(n) ? n.toUpperCase() : "BATIMENT " + n.toUpperCase()) : ["BATIMENT A"];
    for (const name of list) {
      const b = { id: "b" + uid(), name, chapters: [] }; S.d.buildings.push(b);
      for (const t of V7_CHAPTERS) { const c = newChapter(t); S.chaps[c.id] = c; b.chapters.push(c.id); }
    }
    logLine("Dossier créé : " + f.ref, "ok");
    if (f.useDbx) {
      try {
        const loc = await locateDossier(f.ref); S.d.ref = f.ref;
        S.d.src = { root: loc.root.path_display, op: loc.opFolder.path_display || "", rvPath: loc.chosen.path, rvDisplay: loc.chosen.path_display || "", rvName: loc.chosen.name, rvs: loc.rvs.map(r => ({ name: r.name, path: r.path, disp: r.path_display || "" })) };
        S.d.inv = (await scanRV(loc.chosen.path)).map(({ r, k, s, i }) => ({ r, k, s, i }));
        S.d.docSel = S.d.inv.filter(x => x.k === "doc" && x.s && x.s <= MAXDOC && !/DTG/i.test(x.r)).map(x => x.r);
      } catch (e) { logLine("Dossier de visite non retrouvé (" + (e?.code === "nf" ? e.message : mcpMessage(e)) + ") — vous pourrez le chercher plus tard.", "er"); S.d.ref = f.ref; }
    }
    queueSave("d"); Object.keys(S.chaps).forEach(id => queueSave(id));
    S.sel = S.d.buildings[0]?.chapters[0] || null;
    S.lastSaved = null; migrateTx();
    S.busy = null; recentCache = null; renderAll();
    if (f.useRagic) await importRagic(f.ragic || ragicCodeOf(f.ref));
    loadStyleRefs(false).then(renderSources); refreshTrashCount();
    await saveDtgFile();
  } catch (e) { logLine(e?.code === "nf" ? e.message : (e?.message || String(e)), "er"); }
  S.busy = null; renderAll();
}

function ask(msg, buttons) {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="dlg small" role="dialog" aria-modal="true"><p style="margin:0 0 16px">${esc(msg)}</p><div class="row" style="justify-content:flex-end">${buttons.map(([l, v], i) => `<button class="btn ${i === 0 ? "primary" : ""}" data-v="${esc(v)}">${esc(l)}</button>`).join("")}</div></div>`;
    m.addEventListener("click", e => { const v = e.target.closest("[data-v]")?.dataset.v; if (v !== undefined) { m.remove(); res(v); } else if (e.target === m) { m.remove(); res(null); } });
    document.body.append(m); $("button", m).focus();
  });
}

async function coverThumb(url) {
  const bmp = await createImageBitmap(new Blob([dataUrlToU8(url)], { type: "image/jpeg" })); const W = 420, H = 315;
  const sc = Math.max(W / bmp.width, H / bmp.height); const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  cv.getContext("2d").drawImage(bmp, (W - bmp.width * sc) / 2, (H - bmp.height * sc) / 2, bmp.width * sc, bmp.height * sc); bmp.close?.();

}
async function squareThumb(url, size) {

  const cv = document.createElement("canvas"); cv.width = cv.height = size; cv.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size); bmp.close?.();

}
async function findVisitInCalendar() {

async function toTrash(kind, label, data, ctx) {

  try { await Store.trashAdd(S.slug, item); S.trashN++; const el = $("#trashBtn"); if (el) el.textContent = "Corbeille (" + S.trashN + ")"; toast(TRASH_KIND[kind] + " déplacé dans la corbeille."); return true; }

}
async function restoreItem(it) {
  const d = it.data, x = it.ctx || {};
  const chapOf = id => S.chaps[id];
  if (it.kind === "building") {
    const b = d.building; if (S.d.buildings.some(y => y.id === b.id)) b.id = "b" + uid();
    for (const c of d.chapters || []) { if (S.chaps[c.id]) c.id = "c" + uid(); S.chaps[c.id] = c; queueSave(c.id); }
    b.chapters = (d.chapters || []).map(c => c.id);
    S.d.buildings.splice(Math.min(x.index ?? S.d.buildings.length, S.d.buildings.length), 0, b); queueSave("d");
  } else if (it.kind === "chapter") {
    const b = S.d.buildings.find(y => y.id === x.bid) || S.d.buildings[0]; if (!b) return toast("Aucun bâtiment pour restaurer ce chapitre."), false;
    const c = d; if (S.chaps[c.id]) c.id = "c" + uid(); S.chaps[c.id] = c; b.chapters.splice(Math.min(x.index ?? b.chapters.length, b.chapters.length), 0, c.id); queueSave(c.id); queueSave("d");
  } else {
    const c = chapOf(x.cid); if (!c) { toast("Le chapitre « " + (x.ctitle || "?") + " » n’existe plus : restaurez-le d’abord."); return false; }
    if (it.kind === "field") c.fields.splice(Math.min(x.index ?? c.fields.length, c.fields.length), 0, d);
    else if (it.kind === "cost") (c.costs = c.costs || []).splice(Math.min(x.index ?? c.costs.length, c.costs.length), 0, d);
    else if (it.kind === "photo") { const pi = photoIndex(); if (pi.has(d.key)) { toast("Cette photo est déjà intégrée à un chapitre."); return false; } c.photos.splice(Math.min(x.index ?? c.photos.length, c.photos.length), 0, d); }
    queueSave(c.id);
  }

}
async function openTrash() {

    let items = []; try { items = await Store.trashList(S.slug); } catch {}

    $$("[data-rs]", m).forEach(b => b.onclick = async () => { const it = items.find(i => i.id === b.dataset.rs); if (await restoreItem(it)) { await Store.trashDel(S.slug, it.id); toast("Restauré : " + it.label); renderTree(); if (S.tab === "redac") renderEditor(); draw(); } });

  draw();
}

  const bmp = await createImageBitmap(blob); let max = 1600, q = 0.82, url = "";
  for (let k = 0; k < 8; k++) {
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height)); const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(bmp, 0, 0, cv.width, cv.height);

async function dpePng(cls) {

  });

}

    if (/\.hei[cf]$/i.test(f.name)) { bad++; continue; }
    const hits = inv.filter(x => baseName(x.r).toLowerCase() === f.name.toLowerCase());
    const rel = hits.length === 1 ? hits[0].r : "glissées/" + f.name;
