<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Paramètres — Atelier DTG</title>
<style>
body{ font:14px/1.5 "Segoe UI", Arial, sans-serif; margin:0; background:#F3F5F7; color:#17212B; }
main{ padding:22px 26px; } h1{ font-size:19px; margin:0 0 4px; } p.l{ color:#5A6570; margin:0 0 16px; }
fieldset{ border:1px solid #D2D8DE; border-radius:10px; background:#fff; margin:0 0 14px; padding:12px 16px; }
legend{ font-weight:600; color:#1F4E79; padding:0 6px; }
label{ display:block; font-size:13px; color:#5A6570; margin:8px 0 3px; }
input{ width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid #C9D1D9; border-radius:6px; font:inherit; }
.row{ display:flex; gap:8px; align-items:center; } .row input{ flex:1; }
button{ font:inherit; padding:7px 14px; border-radius:6px; border:1px solid #C9D1D9; background:#fff; cursor:pointer; }
button.p{ background:#1F4E79; color:#fff; border-color:#1F4E79; }
.st{ font-size:12.5px; margin-top:4px; } .ok{ color:#2C7A4B; } .er{ color:#D0201A; }
.bar{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
</style></head>
<body><main>
<h1>Paramètres</h1><p class="l">Version de test. Ces réglages sont propres à ce poste.</p>
<fieldset><legend>Dropbox</legend>
  <label for="root">Dossier racine de la Dropbox synchronisée (celui qui contient « Agence T&amp;K »)</label>
  <div class="row"><input id="root"><button id="pick">Parcourir…</button></div><div class="st" id="rootSt"></div>
</fieldset>
<fieldset><legend>Intelligence artificielle (API Anthropic)</legend>
  <label for="ak">Clé API</label><input id="ak" type="password" placeholder="sk-ant-…" autocomplete="off">
  <label for="model">Modèle</label><input id="model">
  <div class="row" style="margin-top:8px"><button id="test">Tester la connexion</button><span class="st" id="aiSt"></span></div>
</fieldset>
<fieldset><legend>Ragic</legend>
  <label for="rk">Clé API Ragic</label><input id="rk" type="password" autocomplete="off">
  <div class="row"><div style="flex:1"><label for="rh">Serveur</label><input id="rh"></div><div style="flex:1"><label for="ra">Espace</label><input id="ra"></div><div style="flex:1"><label for="rs">Feuille Immeubles</label><input id="rs"></div></div>
</fieldset>
<div class="bar"><button id="cancel">Fermer</button><button class="p" id="save">Enregistrer</button></div>
</main>
<script>
const D = window.dtgDesktop, $ = s => document.querySelector(s);
async function load() { const c = await D.cfgGet(); $("#root").value = c.dropboxRoot; $("#ak").value = c.anthropicKey; $("#model").value = c.model; $("#rk").value = c.ragicKey; $("#rh").value = c.ragicHost; $("#ra").value = c.ragicAp; $("#rs").value = c.ragicSheet;
  $("#rootSt").innerHTML = c.dropboxExists ? '<span class="ok">Dossier trouvé.</span>' : '<span class="er">Dossier introuvable : indiquez le dossier Dropbox de ce poste.</span>'; }
$("#pick").onclick = async () => { const p = await D.pickDropbox(); if (p) $("#root").value = p; };
const vals = () => ({ dropboxRoot: $("#root").value.trim(), anthropicKey: $("#ak").value, model: $("#model").value.trim(), ragicKey: $("#rk").value, ragicHost: $("#rh").value.trim(), ragicAp: $("#ra").value.trim(), ragicSheet: $("#rs").value.trim() });
$("#save").onclick = async () => { await D.cfgSet(vals()); await load(); $("#save").textContent = "Enregistré ✓"; setTimeout(() => $("#save").textContent = "Enregistrer", 1500); };
$("#test").onclick = async () => { await D.cfgSet(vals()); $("#aiSt").textContent = "Test en cours…"; try { await D.testAI(); $("#aiSt").innerHTML = '<span class="ok">Connexion à l’IA réussie.</span>'; } catch (e) { $("#aiSt").innerHTML = '<span class="er">' + e.message + "</span>"; } };
$("#cancel").onclick = () => window.close();
load();
</script></body></html>
