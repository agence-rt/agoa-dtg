<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>AGOA DTG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Segoe UI","Open Sans",system-ui,sans-serif;color:#555;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;border:1px solid #d9d9d9}
.logo{width:88px;height:88px;margin-top:42px;border-radius:20px}
h1{margin:34px 0 0;font-size:25px;letter-spacing:.28em;font-weight:700;color:#1d1d1d;padding-left:.28em}
h1 b{color:#b3261e}
.sub{margin:16px 0 0;font-size:14px;color:#666}
.st{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:13px;color:#666}
.ver{position:absolute;right:12px;bottom:12px;font-size:11.5px;color:#999}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:transparent;overflow:hidden}
.bar i{display:block;height:100%;width:80px;background:#b3261e;animation:slide 1.6s ease-in-out infinite}
.bar.det i{animation:none;margin-left:0;transition:width .25s}
@keyframes slide{0%{margin-left:-80px}100%{margin-left:100%}}
</style></head><body>
<img class="logo" src="build/logo.png" alt="AGOA DTG">
<h1>AGOA <b>DTG</b></h1>
<p class="sub">Diagnostic technique global et PPPT</p>
<div class="st" id="st">Démarrage…</div><div class="ver" id="ver"></div>
<div class="bar" id="bar"><i></i></div>
<script>
const { ipcRenderer } = require("electron");
ipcRenderer.on("splash", (e, o) => {
  if (o.text) document.getElementById("st").textContent = o.text;
  if (o.version) document.getElementById("ver").textContent = "v" + o.version;
  const b = document.getElementById("bar");
  if (typeof o.pct === "number") { b.classList.add("det"); b.firstElementChild.style.setProperty("--w", Math.max(0, Math.min(100, o.pct)) + "%"); b.style.setProperty("--w", Math.max(0, Math.min(100, o.pct)) + "%"); b.firstElementChild.style.width = Math.max(0, Math.min(100, o.pct)) + "%"; }
});
</script></body></html>
