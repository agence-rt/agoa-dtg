name: Installateur Windows
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["app/package.json", ".github/workflows/release.yml"]   # nouvelle version sur main : publication automatique
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Secret Google (identification)
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "
          const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); const g = (p.agoa || {}).google || {};
          if (g.clientId && process.env.GOOGLE_CLIENT_SECRET) { g.clientSecret = process.env.GOOGLE_CLIENT_SECRET; fs.writeFileSync('package.json', JSON.stringify(p, null, 2)); console.log('Secret Google injecté pour la fabrication (non enregistré dans le dépôt).'); }
          else console.log('::warning::Secret GOOGLE_CLIENT_SECRET absent : connexion Google désactivée dans cette version.');
          "
      - name: Moteur Whisper (whisper.cpp, reconnaissance vocale locale)
        shell: bash
        run: |
          mkdir -p whisper-bin tmp-w
          for u in https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.5/whisper-bin-x64.zip https://github.com/ggml-org/whisper.cpp/releases/latest/download/whisper-bin-x64.zip; do
            curl -fL --retry 3 -o tmp-w/w.zip "$u" && break
          done
          unzip -q tmp-w/w.zip -d tmp-w/x || 7z x -y -otmp-w/x tmp-w/w.zip
          D=$(dirname "$(find tmp-w/x -name whisper-cli.exe | head -1)")
          test -f "$D/whisper-cli.exe"
          cp -r "$D"/. whisper-bin/
          rm -rf tmp-w
          ls -la whisper-bin
      - run: npm ci
      - run: npm run dist
      - name: Publier l'installateur dans la release
        shell: bash
        working-directory: app
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" dist/AGOA-DTG-Setup-*.exe dist/*.blockmap dist/latest.yml --target "$GITHUB_SHA" --title "Atelier DTG $V" --notes "Installateur Windows AGOA DTG $V." || gh release upload "v$V" dist/AGOA-DTG-Setup-*.exe dist/*.blockmap dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-DTG-Setup
          path: app/dist/AGOA-DTG-Setup-*.exe
