name: Installateur Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Injecter le secret Google (GOOGLE_CLIENT_SECRET)
        shell: bash
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: node -e "require('fs').writeFileSync('google-client.json', JSON.stringify({ clientSecret: process.env.GOOGLE_CLIENT_SECRET || '' }))"
      - run: npm ci
      - run: npm run dist
      - name: Publier l'installateur dans la release
        shell: bash
        working-directory: app
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" dist/AGOA-DTG-Setup-*.exe dist/*.blockmap dist/latest.yml --target "$GITHUB_SHA" --title "Atelier DTG $V" --notes "Installateur Windows AGOA DTG $V." || gh release upload "v$V" dist/AGOA-DTG-Setup-*.exe dist/*.blockmap dist/latest.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-DTG-Setup
          path: app/dist/AGOA-DTG-Setup-*.exe
